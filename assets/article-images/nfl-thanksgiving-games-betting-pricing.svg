    <line x1="-245" y1="-20" x2="-145" y2="-20" stroke="#0e7c86" stroke-width="5" opacity="0.45"/>
    <line x1="-245" y1="10" x2="-170" y2="10" stroke="#0e7c86" stroke-width="5" opacity="0.45"/>

    <rect x="-75" y="-65" width="150" height="130" rx="10" fill="none" stroke="#16233d" stroke-width="7"/>
    <line x1="-50" y1="-28" x2="50" y2="-28" stroke="#16233d" stroke-width="5" opacity="0.5"/>
    <line x1="-50" y1="4" x2="30" y2="4" stroke="#16233d" stroke-width="5" opacity="0.5"/>

    <rect x="120" y="-55" width="150" height="110" rx="10" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <line x1="145" y1="-20" x2="245" y2="-20" stroke="#0e7c86" stroke-width="5" opacity="0.45"/>
