<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- loyalty card -->
  <g transform="translate(500,210)">
    <rect x="-110" y="-70" width="220" height="140" rx="16" fill="#fff" stroke="#16233d" stroke-width="8"/>
    <rect x="-110" y="-40" width="220" height="26" fill="#16233d" opacity="0.85"/>
    <circle cx="-70" cy="35" r="14" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <line x1="-40" y1="35" x2="70" y2="35" stroke="#0e7c86" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- arrow -->
  <g transform="translate(700,210)" stroke="#b8862b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="0" x2="60" y2="0"/>
    <path d="M40 -16 L60 0 L40 16"/>
  </g>

  <!-- comp gift box -->
  <g transform="translate(850,210)">
    <rect x="-55" y="-55" width="110" height="110" rx="10" fill="none" stroke="#16233d" stroke-width="8"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#0e7c86" stroke-width="8"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#0e7c86" stroke-width="8"/>
    <path d="M-30 -55 C -30 -80 30 -80 30 -55" fill="none" stroke="#0e7c86" stroke-width="8"/>
  </g>
</svg>
