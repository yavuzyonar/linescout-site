<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- unbalanced scale: slot symbol heavy side, card + roulette light side -->
  <g transform="translate(600,190)">
    <line x1="0" y1="-20" x2="0" y2="110" stroke="#16233d" stroke-width="10"/>
    <line x1="-140" y1="-60" x2="140" y2="10" stroke="#16233d" stroke-width="8"/>
    <circle cx="0" cy="-25" r="10" fill="#16233d"/>
    <path d="M-140 -60 L-175 5 A42 28 0 0 0 -105 5 Z" fill="none" stroke="#0e7c86" stroke-width="7" stroke-linejoin="round"/>
    <path d="M140 10 L118 45 A28 18 0 0 0 162 45 Z" fill="none" stroke="#b8862b" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-40 110 L40 110 L25 130 L-25 130 Z" fill="#16233d"/>
  </g>
  <!-- slot reel icon over the heavy left pan -->
  <g transform="translate(430,105)">
    <rect x="-42" y="-42" width="84" height="84" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="6"/>
    <line x1="-14" y1="-42" x2="-14" y2="42" stroke="#0e7c86" stroke-width="2" opacity="0.4"/>
    <line x1="14" y1="-42" x2="14" y2="42" stroke="#0e7c86" stroke-width="2" opacity="0.4"/>
    <text x="0" y="10" font-family="Arial" font-size="30" fill="#b8862b" text-anchor="middle" font-weight="bold">7</text>
  </g>
  <!-- playing card icon over the light right pan -->
  <g transform="translate(740,140) rotate(10)">
    <rect x="-26" y="-38" width="52" height="76" rx="7" fill="#fff" stroke="#16233d" stroke-width="5"/>
    <text x="-14" y="-12" font-family="Georgia, serif" font-size="20" fill="#16233d">A</text>
  </g>
</svg>
