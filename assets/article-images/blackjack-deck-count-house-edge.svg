<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- three card-deck stacks of rising height, representing single/double/6-deck shoes -->
  <g transform="translate(450,290)">
    <g transform="translate(0,0)">
      <rect x="-30" y="-24" width="60" height="24" rx="4" fill="none" stroke="#0e7c86" stroke-width="6"/>
    </g>
    <g transform="translate(130,0)">
      <rect x="-32" y="-16" width="64" height="16" rx="4" fill="none" stroke="#0e7c86" stroke-width="5" opacity="0.7"/>
      <rect x="-30" y="-40" width="60" height="24" rx="4" fill="none" stroke="#0e7c86" stroke-width="6"/>
    </g>
    <g transform="translate(260,0)">
      <rect x="-34" y="-10" width="68" height="10" rx="3" fill="none" stroke="#16233d" stroke-width="4" opacity="0.5"/>
      <rect x="-33" y="-24" width="66" height="14" rx="3" fill="none" stroke="#16233d" stroke-width="4" opacity="0.6"/>
      <rect x="-32" y="-42" width="64" height="18" rx="4" fill="none" stroke="#16233d" stroke-width="5" opacity="0.75"/>
      <rect x="-31" y="-64" width="62" height="22" rx="4" fill="none" stroke="#16233d" stroke-width="5" opacity="0.9"/>
      <rect x="-30" y="-90" width="60" height="26" rx="4" fill="none" stroke="#16233d" stroke-width="6"/>
    </g>
  </g>
  <circle cx="700" cy="90" r="8" fill="#b8862b"/>
</svg>
