<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- a puck at a fork, splitting into a short moneyline path and a longer puck-line path with a cushion gap -->
  <g transform="translate(450,220)">
    <ellipse cx="0" cy="0" rx="34" ry="14" fill="#16233d"/>
  </g>
  <path d="M480 220 L580 140" fill="none" stroke="#0e7c86" stroke-width="8" stroke-linecap="round"/>
  <path d="M480 220 L580 295" fill="none" stroke="#b8862b" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 14"/>
  <g transform="translate(640,140)">
    <rect x="-50" y="-22" width="100" height="44" rx="8" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <text x="0" y="8" font-family="Arial" font-size="20" fill="#0e7c86" text-anchor="middle" font-weight="bold">ML</text>
  </g>
  <g transform="translate(640,295)">
    <rect x="-56" y="-22" width="112" height="44" rx="8" fill="none" stroke="#b8862b" stroke-width="6"/>
    <text x="0" y="8" font-family="Arial" font-size="18" fill="#b8862b" text-anchor="middle" font-weight="bold">-1.5</text>
  </g>
</svg>
