<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- gavel beside a jagged market line, representing regulatory scrutiny of prediction markets -->
  <g transform="translate(480,200)">
    <g transform="rotate(-35)">
      <rect x="-90" y="-22" width="90" height="44" rx="8" fill="none" stroke="#16233d" stroke-width="8"/>
      <rect x="-20" y="-34" width="30" height="68" rx="6" fill="none" stroke="#0e7c86" stroke-width="8"/>
    </g>
    <rect x="-90" y="70" width="180" height="16" rx="4" fill="#16233d"/>
    <line x1="-60" y1="70" x2="-60" y2="40" stroke="#16233d" stroke-width="8"/>
    <line x1="60" y1="70" x2="60" y2="40" stroke="#0e7c86" stroke-width="8"/>
  </g>
  <g transform="translate(760,190)">
    <polyline points="-140,40 -90,-10 -40,30 10,-60 60,10 140,-50" fill="none" stroke="#b8862b" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="140" cy="-50" r="11" fill="#b8862b"/>
  </g>
</svg>
