      <line x1="0" y1="120" x2="0" y2="86"/>
      <line x1="-120" y1="0" x2="-86" y2="0"/>
      <line x1="120" y1="0" x2="86" y2="0"/>
      <line x1="-85" y1="-85" x2="-61" y2="-61"/>
