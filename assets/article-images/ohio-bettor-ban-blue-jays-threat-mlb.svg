    <line x1="-62" y1="-62" x2="62" y2="62" stroke="#16233d" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="translate(790,150) rotate(-35)">
    <rect x="-18" y="-60" width="36" height="90" rx="6" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <rect x="-46" y="-78" width="92" height="34" rx="6" fill="none" stroke="#0e7c86" stroke-width="6"/>
  </g>
  <line x1="770" y1="230" x2="860" y2="230" stroke="#b8862b" stroke-width="7" stroke-linecap="round"/>
