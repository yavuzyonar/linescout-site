<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- gavel striking down on two overlapping sweepstakes coins -->
  <g transform="translate(600,150)">
    <g transform="rotate(-35)">
      <rect x="-95" y="-24" width="95" height="48" rx="8" fill="none" stroke="#16233d" stroke-width="8"/>
      <rect x="-24" y="-38" width="34" height="76" rx="6" fill="none" stroke="#0e7c86" stroke-width="8"/>
    </g>
  </g>
  <g transform="translate(500,290)">
    <circle cx="0" cy="0" r="58" fill="none" stroke="#16233d" stroke-width="7"/>
    <text x="0" y="12" font-family="Arial" font-size="30" fill="#16233d" text-anchor="middle">SC</text>
  </g>
  <g transform="translate(630,250)">
    <circle cx="0" cy="0" r="58" fill="none" stroke="#0e7c86" stroke-width="7"/>
    <text x="0" y="12" font-family="Arial" font-size="30" fill="#0e7c86" text-anchor="middle">GC</text>
  </g>
</svg>
