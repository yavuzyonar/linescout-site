<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- three market bars of different heights, each topped by its own limit ceiling -->
  <g transform="translate(440,290)">
    <line x1="-25" y1="-165" x2="35" y2="-165" stroke="#16233d" stroke-width="5" opacity="0.55"/>
    <rect x="-15" y="-150" width="50" height="150" rx="6" fill="#16233d"/>
    <text x="10" y="20" font-family="Arial" font-size="16" fill="#16233d" opacity="0.7" text-anchor="middle">ML</text>
  </g>
  <g transform="translate(560,290)">
    <line x1="-25" y1="-105" x2="35" y2="-105" stroke="#0e7c86" stroke-width="5" opacity="0.55"/>
    <rect x="-15" y="-92" width="50" height="92" rx="6" fill="#0e7c86"/>
    <text x="10" y="20" font-family="Arial" font-size="16" fill="#16233d" opacity="0.7" text-anchor="middle">Spread</text>
  </g>
  <g transform="translate(690,290)">
    <line x1="-25" y1="-52" x2="35" y2="-52" stroke="#b8862b" stroke-width="5"/>
    <rect x="-15" y="-42" width="50" height="42" rx="6" fill="#16233d" opacity="0.5"/>
    <text x="10" y="20" font-family="Arial" font-size="16" fill="#16233d" opacity="0.7" text-anchor="middle">Prop</text>
  </g>
  <g transform="translate(810,140) rotate(18)">
    <ellipse cx="0" cy="0" rx="52" ry="30" fill="none" stroke="#16233d" stroke-width="7"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#16233d" stroke-width="4" opacity="0.6"/>
    <line x1="-11" y1="-9" x2="-11" y2="9" stroke="#16233d" stroke-width="4" opacity="0.6"/>
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#16233d" stroke-width="4" opacity="0.6"/>
    <line x1="11" y1="-9" x2="11" y2="9" stroke="#16233d" stroke-width="4" opacity="0.6"/>
  </g>
</svg>
