<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- playing card beside a tuning dial, representing rules "tuning" the house edge -->
  <g transform="translate(520,200)">
    <rect x="-90" y="-120" width="150" height="215" rx="14" fill="#fff" stroke="#16233d" stroke-width="8"/>
    <text x="-58" y="-60" font-family="Georgia, serif" font-size="40" fill="#16233d">A</text>
    <circle cx="-14" cy="35" r="16" fill="none" stroke="#0e7c86" stroke-width="6"/>
  </g>
  <g transform="translate(730,205)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#16233d" stroke-width="10"/>
    <path d="M -67 47 A 95 95 0 1 1 67 47" fill="none" stroke="#0e7c86" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="40" y2="-58" stroke="#b8862b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="#16233d"/>
    <text x="-90" y="80" font-family="Arial" font-size="20" fill="#16233d" opacity="0.55">0.5%</text>
    <text x="55" y="80" font-family="Arial" font-size="20" fill="#16233d" opacity="0.55">2%+</text>
  </g>
