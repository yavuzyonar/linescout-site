<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- left: variable-height reel columns (Megaways) -->
  <g transform="translate(430,205)">
    <rect x="0" y="-40" width="34" height="80" rx="6" fill="none" stroke="#16233d" stroke-width="7"/>
    <rect x="46" y="-75" width="34" height="150" rx="6" fill="none" stroke="#0e7c86" stroke-width="7"/>
    <rect x="92" y="-25" width="34" height="50" rx="6" fill="none" stroke="#16233d" stroke-width="7"/>
    <rect x="138" y="-90" width="34" height="180" rx="6" fill="none" stroke="#0e7c86" stroke-width="7"/>
  </g>

  <!-- right: cluster of adjacent matching hex/circle symbols (Cluster Pays) -->
  <g transform="translate(700,195)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#0e7c86" stroke-width="7"/>
    <circle cx="52" cy="-18" r="26" fill="none" stroke="#0e7c86" stroke-width="7"/>
    <circle cx="52" cy="34" r="26" fill="none" stroke="#0e7c86" stroke-width="7"/>
    <circle cx="104" cy="0" r="26" fill="none" stroke="#16233d" stroke-width="7"/>
    <circle cx="26" cy="-50" r="26" fill="none" stroke="#16233d" stroke-width="7" opacity="0.35"/>
  </g>
  <circle cx="600" cy="90" r="9" fill="#b8862b"/>
</svg>
