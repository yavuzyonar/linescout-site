<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- small football above a numeric rating bar-chart (left) vs a numbered ordinal list (right) -->
  <g transform="translate(600,80)">
    <ellipse cx="0" cy="0" rx="38" ry="21" fill="none" stroke="#16233d" stroke-width="6"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#0e7c86" stroke-width="4"/>
    <line x1="-7" y1="-7" x2="-7" y2="7" stroke="#0e7c86" stroke-width="4"/>
    <line x1="7" y1="-7" x2="7" y2="7" stroke="#0e7c86" stroke-width="4"/>
  </g>
  <line x1="600" y1="115" x2="600" y2="320" stroke="#16233d" stroke-width="4" stroke-dasharray="9 10" opacity="0.35"/>
  <g transform="translate(395,175)">
    <rect x="0" y="0" width="140" height="20" rx="6" fill="#0e7c86"/>
    <rect x="0" y="36" width="100" height="20" rx="6" fill="#0e7c86" opacity="0.7"/>
    <rect x="0" y="72" width="65" height="20" rx="6" fill="#0e7c86" opacity="0.45"/>
  </g>
  <g transform="translate(660,175)">
    <circle cx="14" cy="10" r="14" fill="#16233d"/>
    <text x="14" y="15" font-family="Arial" font-size="15" fill="#fff" text-anchor="middle">1</text>
    <rect x="40" y="3" width="110" height="14" rx="5" fill="#16233d" opacity="0.45"/>
    <circle cx="14" cy="46" r="14" fill="#16233d"/>
    <text x="14" y="51" font-family="Arial" font-size="15" fill="#fff" text-anchor="middle">2</text>
    <rect x="40" y="39" width="110" height="14" rx="5" fill="#16233d" opacity="0.45"/>
    <circle cx="14" cy="82" r="14" fill="#16233d"/>
    <text x="14" y="87" font-family="Arial" font-size="15" fill="#fff" text-anchor="middle">3</text>
    <rect x="40" y="75" width="110" height="14" rx="5" fill="#16233d" opacity="0.45"/>
  </g>
