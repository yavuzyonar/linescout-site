<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- grid of 4 ticket cards -->
  <g transform="translate(450,120)">
    <rect x="0" y="0" width="130" height="80" rx="10" fill="none" stroke="#16233d" stroke-width="6"/>
    <rect x="160" y="0" width="130" height="80" rx="10" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <rect x="0" y="100" width="130" height="80" rx="10" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <rect x="160" y="100" width="130" height="80" rx="10" fill="none" stroke="#16233d" stroke-width="6"/>
    <line x1="20" y1="40" x2="110" y2="40" stroke="#16233d" stroke-width="5" opacity="0.4"/>
    <line x1="180" y1="40" x2="270" y2="40" stroke="#0e7c86" stroke-width="5" opacity="0.4"/>
    <line x1="20" y1="140" x2="110" y2="140" stroke="#0e7c86" stroke-width="5" opacity="0.4"/>
    <line x1="180" y1="140" x2="270" y2="140" stroke="#16233d" stroke-width="5" opacity="0.4"/>
  </g>
</svg>
