<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- football crossing a goal line with a "+2" badge, and a small total/spread tick mark -->
  <g transform="translate(560,200)">
    <ellipse cx="0" cy="0" rx="78" ry="48" fill="none" stroke="#16233d" stroke-width="8"/>
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#16233d" stroke-width="5" opacity="0.6"/>
    <line x1="-14" y1="-13" x2="-14" y2="13" stroke="#16233d" stroke-width="5" opacity="0.6"/>
    <line x1="14" y1="-13" x2="14" y2="13" stroke="#16233d" stroke-width="5" opacity="0.6"/>
  </g>
  <line x1="695" y1="70" x2="695" y2="350" stroke="#0e7c86" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>
  <g transform="translate(770,140)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#b8862b" stroke-width="6"/>
    <text x="0" y="10" font-family="Arial" font-weight="bold" font-size="30" fill="#b8862b" text-anchor="middle">+2</text>
  </g>
  <g transform="translate(430,320)" stroke="#0e7c86" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-50,10 -15,-18 20,0 55,-30"/>
  </g>
</svg>
