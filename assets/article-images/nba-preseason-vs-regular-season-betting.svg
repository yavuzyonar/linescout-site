<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- basketball beside a gauge needle resting at a low reading -->
  <g transform="translate(460,210)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#16233d" stroke-width="8"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#0e7c86" stroke-width="5"/>
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#0e7c86" stroke-width="5"/>
    <path d="M-67 -67 A95 95 0 0 1 67 67" fill="none" stroke="#0e7c86" stroke-width="5"/>
    <path d="M-67 67 A95 95 0 0 1 67 -67" fill="none" stroke="#0e7c86" stroke-width="5"/>
  </g>
  <g transform="translate(730,240)">
    <path d="M -90 10 A 90 90 0 0 1 90 10" fill="none" stroke="#16233d" stroke-width="12" stroke-linecap="round"/>
    <path d="M -90 10 A 90 90 0 0 1 -70 -55" fill="none" stroke="#b8862b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="9" fill="#16233d"/>
    <line x1="0" y1="10" x2="-55" y2="-30" stroke="#16233d" stroke-width="7" stroke-linecap="round"/>
    <text x="-95" y="40" font-family="Arial" font-size="18" fill="#16233d" opacity="0.6">LOW</text>
    <text x="55" y="40" font-family="Arial" font-size="18" fill="#16233d" opacity="0.6">FULL</text>
  </g>
</svg>
