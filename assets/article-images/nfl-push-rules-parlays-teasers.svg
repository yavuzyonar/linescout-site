<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- betting ticket with a refund/return loop, representing a push -->
  <g transform="translate(590,215)">
    <rect x="-110" y="-130" width="220" height="260" rx="14" fill="#fff" stroke="#16233d" stroke-width="8"/>
    <line x1="-78" y1="-85" x2="78" y2="-85" stroke="#16233d" stroke-width="6" opacity="0.5"/>
    <line x1="-78" y1="-50" x2="78" y2="-50" stroke="#16233d" stroke-width="6" opacity="0.5"/>
    <line x1="-78" y1="-15" x2="30" y2="-15" stroke="#16233d" stroke-width="6" opacity="0.5"/>
    <g transform="rotate(-10)">
      <text x="-72" y="75" font-family="Arial" font-size="46" font-weight="bold" fill="#0e7c86">PUSH</text>
      <rect x="-82" y="38" width="190" height="56" rx="10" fill="none" stroke="#0e7c86" stroke-width="5"/>
    </g>
  </g>
  <g transform="translate(750,100)" fill="none" stroke="#b8862b" stroke-width="7" stroke-linecap="round">
    <path d="M-40 10 A42 42 0 1 1 20 48"/>
    <path d="M6 32 L20 48 L36 30"/>
