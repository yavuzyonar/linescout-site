    <line x1="0" y1="0" x2="0" y2="-34" stroke="#0e7c86" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="26" y2="14" stroke="#0e7c86" stroke-width="6" stroke-linecap="round"/>
