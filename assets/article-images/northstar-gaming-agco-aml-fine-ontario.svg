    <line x1="-95" y1="-35" x2="-5" y2="-35" stroke="#16233d" stroke-width="6" opacity="0.5"/>
    <line x1="-95" y1="0" x2="-30" y2="0" stroke="#16233d" stroke-width="6" opacity="0.5"/>
    <text x="-95" y="45" font-family="Arial" font-size="26" fill="#b8862b" font-weight="bold">$</text>
    <circle cx="70" cy="60" r="60" fill="none" stroke="#0e7c86" stroke-width="10"/>
    <line x1="113" y1="103" x2="160" y2="150" stroke="#0e7c86" stroke-width="12" stroke-linecap="round"/>
