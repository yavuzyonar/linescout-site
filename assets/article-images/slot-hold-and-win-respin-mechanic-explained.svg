<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- 3x3 locked grid -->
  <g transform="translate(540,80)">
    <rect x="0" y="0" width="300" height="240" rx="10" fill="none" stroke="#16233d" stroke-width="7"/>
    <line x1="100" y1="0" x2="100" y2="240" stroke="#16233d" stroke-width="5" opacity="0.5"/>
    <line x1="200" y1="0" x2="200" y2="240" stroke="#16233d" stroke-width="5" opacity="0.5"/>
    <line x1="0" y1="80" x2="300" y2="80" stroke="#16233d" stroke-width="5" opacity="0.5"/>
    <line x1="0" y1="160" x2="300" y2="160" stroke="#16233d" stroke-width="5" opacity="0.5"/>
    <!-- locked coin symbols in some cells -->
    <circle cx="50" cy="40" r="26" fill="none" stroke="#b8862b" stroke-width="6"/>
    <circle cx="150" cy="40" r="26" fill="none" stroke="#b8862b" stroke-width="6"/>
    <circle cx="250" cy="120" r="26" fill="none" stroke="#b8862b" stroke-width="6"/>
    <circle cx="50" cy="200" r="26" fill="none" stroke="#b8862b" stroke-width="6"/>
    <circle cx="150" cy="200" r="26" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <!-- small padlock on top-right corner -->
    <g transform="translate(300,0)">
      <rect x="-16" y="-10" width="32" height="26" rx="4" fill="#16233d"/>
      <path d="M-10 -10 L-10 -22 A10 10 0 0 1 10 -22 L10 -10" fill="none" stroke="#16233d" stroke-width="6"/>
    </g>
  </g>

  <!-- respin counter dots -->
  <g transform="translate(910,200)">
    <text x="0" y="-70" font-family="Arial" font-weight="bold" font-size="20" fill="#16233d" opacity="0.6" text-anchor="middle">RESPINS</text>
    <circle cx="-50" cy="0" r="16" fill="#0e7c86"/>
    <circle cx="0" cy="0" r="16" fill="#0e7c86" opacity="0.55"/>
    <circle cx="50" cy="0" r="16" fill="#0e7c86" opacity="0.25"/>
  </g>
</svg>
