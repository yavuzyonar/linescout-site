<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- stopwatch nearly at zero -->
  <g transform="translate(490,210)">
    <circle cx="0" cy="0" r="105" fill="none" stroke="#16233d" stroke-width="10"/>
    <line x1="-38" y1="-98" x2="38" y2="-98" stroke="#16233d" stroke-width="10" stroke-linecap="round"/>
    <line x1="70" y1="-138" x2="95" y2="-165" stroke="#16233d" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-70" stroke="#0e7c86" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="45" y2="35" stroke="#0e7c86" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="#16233d"/>
  </g>

  <!-- football -->
  <g transform="translate(700,190)">
    <ellipse cx="0" cy="0" rx="95" ry="50" fill="none" stroke="#16233d" stroke-width="8"/>
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#0e7c86" stroke-width="5"/>
    <line x1="-20" y1="-11" x2="-20" y2="11" stroke="#0e7c86" stroke-width="5"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#0e7c86" stroke-width="5"/>
    <line x1="20" y1="-11" x2="20" y2="11" stroke="#0e7c86" stroke-width="5"/>
  </g>

  <!-- upward scoreboard arrow -->
  <g transform="translate(830,150)" stroke="#b8862b" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-40 60 L0 10 L35 40 L80 -30"/>
    <path d="M55 -30 L80 -30 L80 -5"/>
  </g>
</svg>
