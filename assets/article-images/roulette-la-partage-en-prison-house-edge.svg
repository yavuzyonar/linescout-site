    <line x1="-105" y1="0" x2="105" y2="0" stroke="#16233d" stroke-width="3" opacity="0.3"/>
    <line x1="-74" y1="-74" x2="74" y2="74" stroke="#16233d" stroke-width="3" opacity="0.3"/>
    <line x1="-74" y1="74" x2="74" y2="-74" stroke="#16233d" stroke-width="3" opacity="0.3"/>
  </g>
  <g transform="translate(750,225)">
