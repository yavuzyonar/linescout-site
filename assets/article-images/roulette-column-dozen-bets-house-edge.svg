<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- roulette number grid: 3 columns x 4 rows, with a dozen row and a column both highlighted -->
  <g transform="translate(495,130)">
    <g stroke="#16233d" stroke-width="3" fill="none" opacity="0.55">
      <rect x="0" y="0" width="210" height="160" rx="6"/>
      <line x1="70" y1="0" x2="70" y2="160"/>
      <line x1="140" y1="0" x2="140" y2="160"/>
      <line x1="0" y1="40" x2="210" y2="40"/>
      <line x1="0" y1="80" x2="210" y2="80"/>
      <line x1="0" y1="120" x2="210" y2="120"/>
    </g>
    <rect x="0" y="0" width="70" height="160" fill="#0e7c86" opacity="0.22"/>
    <rect x="0" y="0" width="210" height="40" fill="#b8862b" opacity="0.25"/>
    <circle cx="35" cy="20" r="11" fill="#16233d"/>
    <circle cx="35" cy="60" r="11" fill="#16233d" opacity="0.6"/>
    <circle cx="35" cy="100" r="11" fill="#16233d" opacity="0.6"/>
    <circle cx="35" cy="140" r="11" fill="#16233d" opacity="0.6"/>
    <circle cx="105" cy="20" r="11" fill="#0e7c86" opacity="0.7"/>
    <circle cx="175" cy="20" r="11" fill="#0e7c86" opacity="0.7"/>
  </g>
</svg>
