<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- five fanned cards (high hand) beside two cards (low hand) -->
  <g transform="translate(430,200)">
    <g transform="rotate(-24)"><rect x="-42" y="-78" width="84" height="130" rx="10" fill="#fff" stroke="#16233d" stroke-width="5"/></g>
    <g transform="rotate(-12)"><rect x="-42" y="-78" width="84" height="130" rx="10" fill="#fff" stroke="#16233d" stroke-width="5"/></g>
    <g transform="rotate(0)"><rect x="-42" y="-78" width="84" height="130" rx="10" fill="#fff" stroke="#16233d" stroke-width="5"/>
      <text x="-20" y="-38" font-family="Georgia, serif" font-size="24" fill="#16233d">K</text></g>
    <g transform="rotate(12)"><rect x="-42" y="-78" width="84" height="130" rx="10" fill="#fff" stroke="#16233d" stroke-width="5"/></g>
    <g transform="rotate(24)"><rect x="-42" y="-78" width="84" height="130" rx="10" fill="#fff" stroke="#16233d" stroke-width="5"/></g>
  </g>
  <g transform="translate(760,225)">
    <g transform="rotate(-8)"><rect x="-46" y="-82" width="92" height="140" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="6"/></g>
    <g transform="rotate(8)"><rect x="-46" y="-82" width="92" height="140" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="6"/>
      <text x="-24" y="-40" font-family="Georgia, serif" font-size="26" fill="#0e7c86">A</text></g>
  </g>
</svg>
