<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- number line with a spread shifting across key numbers 3 and 7 -->
  <g transform="translate(600,210)">
    <line x1="-260" y1="0" x2="260" y2="0" stroke="#16233d" stroke-width="6" stroke-linecap="round"/>
    <!-- tick marks -->
    <line x1="-180" y1="-14" x2="-180" y2="14" stroke="#16233d" stroke-width="5"/>
    <line x1="-60" y1="-14" x2="-60" y2="14" stroke="#0e7c86" stroke-width="7"/>
    <line x1="60" y1="-14" x2="60" y2="14" stroke="#0e7c86" stroke-width="7"/>
    <line x1="180" y1="-14" x2="180" y2="14" stroke="#16233d" stroke-width="5"/>
    <text x="-60" y="46" font-family="Arial" font-size="22" fill="#0e7c86" text-anchor="middle" font-weight="bold">3</text>
    <text x="60" y="46" font-family="Arial" font-size="22" fill="#0e7c86" text-anchor="middle" font-weight="bold">7</text>
    <!-- original point (dashed) -->
    <circle cx="-30" cy="0" r="12" fill="none" stroke="#16233d" stroke-width="4" stroke-dasharray="4 4"/>
    <!-- arrow moving right across both key numbers -->
    <path d="M -30 0 C 30 -90 120 -90 168 -6" fill="none" stroke="#b8862b" stroke-width="7" stroke-linecap="round"/>
    <path d="M 150 -20 L 172 -4 L 148 6 Z" fill="#b8862b"/>
    <circle cx="168" cy="-6" r="12" fill="#16233d"/>
  </g>
</svg>
