    <line x1="-50" y1="-110" x2="-50" y2="110" stroke="#16233d" stroke-width="4" opacity="0.4"/>
    <line x1="50" y1="-110" x2="50" y2="110" stroke="#16233d" stroke-width="4" opacity="0.4"/>
    <rect x="-130" y="-85" width="60" height="42" rx="6" fill="none" stroke="#0e7c86" stroke-width="5"/>
    <rect x="-30" y="-85" width="60" height="42" rx="6" fill="none" stroke="#0e7c86" stroke-width="5" opacity="0.55"/>
    <rect x="70" y="-85" width="60" height="42" rx="6" fill="none" stroke="#0e7c86" stroke-width="5"/>
    <rect x="-130" y="-30" width="60" height="42" rx="6" fill="none" stroke="#16233d" stroke-width="5" opacity="0.7"/>
    <rect x="-30" y="-30" width="60" height="42" rx="6" fill="none" stroke="#16233d" stroke-width="5"/>
    <rect x="70" y="-30" width="60" height="42" rx="6" fill="none" stroke="#16233d" stroke-width="5" opacity="0.7"/>
    <rect x="-130" y="30" width="60" height="42" rx="6" fill="none" stroke="#b8862b" stroke-width="5" opacity="0.85"/>
    <rect x="-30" y="30" width="60" height="42" rx="6" fill="none" stroke="#0e7c86" stroke-width="5" opacity="0.5"/>
    <rect x="70" y="30" width="60" height="42" rx="6" fill="none" stroke="#16233d" stroke-width="5" opacity="0.5"/>
  </g>
  <g transform="translate(785,80)" stroke="#0e7c86" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-14,-16 0,0 14,-16"/>
    <polyline points="-14,4 0,20 14,4"/>
