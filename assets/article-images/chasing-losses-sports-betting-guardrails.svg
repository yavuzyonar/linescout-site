    <rect x="0" y="-30" width="40" height="30" rx="5" fill="#0e7c86" opacity="0.55"/>
    <rect x="60" y="-65" width="40" height="65" rx="5" fill="#0e7c86" opacity="0.75"/>
    <rect x="120" y="-115" width="40" height="115" rx="5" fill="#16233d"/>
  </g>
  <g transform="translate(670,195)" stroke="#b8862b" stroke-width="9" fill="none" stroke-linecap="round">
    <line x1="0" y1="-90" x2="0" y2="90"/>
    <line x1="60" y1="-90" x2="60" y2="90"/>
    <line x1="120" y1="-90" x2="120" y2="90"/>
    <line x1="-15" y1="-45" x2="135" y2="-45"/>
    <line x1="-15" y1="20" x2="135" y2="20"/>
  </g>
</svg>
