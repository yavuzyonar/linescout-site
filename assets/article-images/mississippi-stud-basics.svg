    <ellipse cx="0" cy="-18" rx="26" ry="9" fill="none" stroke="#0e7c86" stroke-width="5"/>
    <ellipse cx="0" cy="-6" rx="26" ry="9" fill="none" stroke="#0e7c86" stroke-width="5"/>
