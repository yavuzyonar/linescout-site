<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- slot reel inside a video-streaming play frame -->
  <g transform="translate(600,200)">
    <rect x="-170" y="-115" width="340" height="230" rx="16" fill="none" stroke="#16233d" stroke-width="8"/>
    <!-- three slot reels -->
    <rect x="-130" y="-75" width="70" height="150" rx="8" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <rect x="-35" y="-75" width="70" height="150" rx="8" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <rect x="60" y="-75" width="70" height="150" rx="8" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <circle cx="-95" cy="0" r="18" fill="#16233d"/>
    <path d="M -10 -18 L 20 0 L -10 18 Z" fill="#16233d"/>
    <circle cx="95" cy="0" r="18" fill="none" stroke="#16233d" stroke-width="6"/>
    <!-- streaming play button badge -->
    <circle cx="130" cy="-95" r="26" fill="#b8862b"/>
    <path d="M -8 -10 L 12 0 L -8 10 Z" fill="#fff" transform="translate(130,-95)"/>
  </g>
</svg>
