<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- two differently-styled coins with a prohibition slash over one, representing a dual-currency sweepstakes ban -->
  <g transform="translate(490,210)">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#16233d" stroke-width="9"/>
    <text x="-24" y="16" font-family="Georgia, serif" font-size="46" fill="#16233d">G</text>
  </g>
  <g transform="translate(730,210)">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#0e7c86" stroke-width="9"/>
    <text x="-24" y="16" font-family="Georgia, serif" font-size="46" fill="#0e7c86">S</text>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#b8862b" stroke-width="8"/>
    <line x1="-71" y1="-71" x2="71" y2="71" stroke="#b8862b" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
