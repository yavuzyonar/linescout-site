<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- 5x3 reel grid: left half shows one zigzag payline, right half shows all cells lit -->
  <g transform="translate(600,210)">
    <g transform="translate(-230,-80)">
      <rect x="0" y="0" width="460" height="160" rx="10" fill="none" stroke="#16233d" stroke-width="5" opacity="0.35"/>
      <line x1="92" y1="0" x2="92" y2="160" stroke="#16233d" stroke-width="3" opacity="0.25"/>
      <line x1="184" y1="0" x2="184" y2="160" stroke="#16233d" stroke-width="3" opacity="0.25"/>
      <line x1="276" y1="0" x2="276" y2="160" stroke="#16233d" stroke-width="3" opacity="0.25"/>
      <line x1="368" y1="0" x2="368" y2="160" stroke="#16233d" stroke-width="3" opacity="0.25"/>
      <line x1="0" y1="53" x2="460" y2="53" stroke="#16233d" stroke-width="3" opacity="0.25"/>
      <line x1="0" y1="106" x2="460" y2="106" stroke="#16233d" stroke-width="3" opacity="0.25"/>
    </g>
    <path d="M -184 -53 L -92 -133 L 0 -53 L 92 -133 L 184 -53" transform="translate(0,53)"
          fill="none" stroke="#0e7c86" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="790" cy="90" r="7" fill="#b8862b"/>
</svg>
