    <rect x="-70" y="-100" width="130" height="185" rx="12" fill="#fff" stroke="#16233d" stroke-width="7"/>
    <text x="-46" y="-58" font-family="Georgia, serif" font-size="32" fill="#16233d">Q</text>
  </g>
  <g transform="translate(710,265) rotate(18)">
    <rect x="-46" y="-72" width="92" height="130" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="6"/>
    <circle cx="-16" cy="-30" r="9" fill="none" stroke="#0e7c86" stroke-width="5"/>
    <circle cx="16" cy="12" r="9" fill="none" stroke="#0e7c86" stroke-width="5"/>
    <line x1="-20" y1="18" x2="20" y2="-36" stroke="#0e7c86" stroke-width="5"/>
  </g>
</svg>
