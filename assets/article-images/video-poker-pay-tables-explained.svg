<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- pay table card with a highlighted row -->
  <g transform="translate(600,200)">
    <rect x="-170" y="-110" width="340" height="220" rx="14" fill="none" stroke="#16233d" stroke-width="7"/>
    <line x1="-170" y1="-60" x2="170" y2="-60" stroke="#16233d" stroke-width="4" opacity="0.5"/>
    <line x1="-170" y1="-15" x2="170" y2="-15" stroke="#16233d" stroke-width="4" opacity="0.5"/>
    <rect x="-165" y="10" width="330" height="45" rx="6" fill="#0e7c86" opacity="0.85"/>
    <line x1="-170" y1="80" x2="170" y2="80" stroke="#16233d" stroke-width="4" opacity="0.5"/>
    <text x="-150" y="-35" font-family="Arial" font-size="20" fill="#16233d" opacity="0.6">Full House</text>
    <text x="130" y="-35" font-family="Arial" font-size="20" fill="#16233d" text-anchor="end" opacity="0.6">9</text>
    <text x="-150" y="10" font-family="Arial" font-size="20" fill="#16233d" opacity="0.6">Flush</text>
    <text x="130" y="10" font-family="Arial" font-size="20" fill="#16233d" text-anchor="end" opacity="0.6">6</text>
    <text x="-150" y="40" font-family="Arial" font-size="22" fill="#fff" font-weight="bold">Straight</text>
    <text x="140" y="40" font-family="Arial" font-size="22" fill="#fff" text-anchor="end" font-weight="bold">4</text>
    <text x="-150" y="105" font-family="Arial" font-size="20" fill="#16233d" opacity="0.6">Two Pair</text>
    <text x="130" y="105" font-family="Arial" font-size="20" fill="#16233d" text-anchor="end" opacity="0.6">2</text>
  </g>
</svg>
