    <line x1="-200" y1="-70" x2="-155" y2="-70" stroke="#16233d" stroke-width="4" opacity="0.5"/>
    <line x1="-200" y1="-30" x2="-155" y2="-30" stroke="#16233d" stroke-width="4" opacity="0.5"/>
    <line x1="170" y1="-70" x2="215" y2="-70" stroke="#0e7c86" stroke-width="4" opacity="0.5"/>
    <line x1="170" y1="-30" x2="215" y2="-30" stroke="#0e7c86" stroke-width="4" opacity="0.5"/>
    <path d="M-100 -40 L60 -40" stroke="#b8862b" stroke-width="8" stroke-dasharray="14 12" stroke-linecap="round"/>
