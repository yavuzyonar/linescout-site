<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- hockey net -->
  <g transform="translate(500,210)">
    <path d="M-90 70 L-90 -50 L-55 -80 L55 -80 L90 -50 L90 70" fill="none" stroke="#16233d" stroke-width="8" stroke-linejoin="round"/>
    <line x1="-90" y1="70" x2="90" y2="70" stroke="#16233d" stroke-width="8"/>
    <line x1="-70" y1="-40" x2="70" y2="60" stroke="#0e7c86" stroke-width="3" opacity="0.35"/>
    <line x1="70" y1="-40" x2="-70" y2="60" stroke="#0e7c86" stroke-width="3" opacity="0.35"/>
    <ellipse cx="0" cy="92" rx="20" ry="9" fill="#16233d"/>
  </g>

  <!-- man-advantage dots: 5 attacking (teal) vs 4 defending (navy) -->
  <g fill="#0e7c86">
    <circle cx="730" cy="150" r="14"/>
    <circle cx="775" cy="172" r="14"/>
    <circle cx="730" cy="198" r="14"/>
    <circle cx="778" cy="232" r="14"/>
    <circle cx="738" cy="258" r="14"/>
  </g>
  <g fill="#16233d">
    <circle cx="860" cy="170" r="14"/>
    <circle cx="892" cy="205" r="14"/>
    <circle cx="860" cy="240" r="14"/>
    <circle cx="892" cy="275" r="14"/>
  </g>
</svg>
