<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- two fanned cards with a gap between them and a third card dropping into the spread -->
  <g transform="translate(460,220) rotate(-12)">
    <rect x="-55" y="-90" width="110" height="160" rx="12" fill="#fff" stroke="#16233d" stroke-width="6"/>
    <text x="-30" y="-48" font-family="Georgia, serif" font-size="30" fill="#16233d">4</text>
  </g>
  <g transform="translate(740,220) rotate(12)">
    <rect x="-55" y="-90" width="110" height="160" rx="12" fill="#fff" stroke="#16233d" stroke-width="6"/>
    <text x="-30" y="-48" font-family="Georgia, serif" font-size="30" fill="#16233d">9</text>
  </g>
  <line x1="530" y1="115" x2="530" y2="325" stroke="#b8862b" stroke-width="3" stroke-dasharray="3 10" opacity="0.7"/>
  <line x1="670" y1="115" x2="670" y2="325" stroke="#b8862b" stroke-width="3" stroke-dasharray="3 10" opacity="0.7"/>
  <g transform="translate(600,140)">
    <rect x="-40" y="-55" width="80" height="112" rx="10" fill="#0e7c86" stroke="#16233d" stroke-width="5"/>
    <text x="-14" y="-10" font-family="Georgia, serif" font-size="24" fill="#fff">7</text>
  </g>
</svg>
