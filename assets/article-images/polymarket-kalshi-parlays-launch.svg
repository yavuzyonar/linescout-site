<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- three linked tickets forming a combo/parlay chain -->
  <g transform="translate(600,210)">
    <g transform="translate(-180,0) rotate(-6)">
      <rect x="-70" y="-45" width="140" height="90" rx="12" fill="none" stroke="#16233d" stroke-width="7"/>
      <circle cx="-70" cy="0" r="8" fill="#f6faf9" stroke="#16233d" stroke-width="5"/>
      <circle cx="70" cy="0" r="8" fill="#f6faf9" stroke="#16233d" stroke-width="5"/>
    </g>
    <g transform="translate(0,-18) rotate(3)">
      <rect x="-70" y="-45" width="140" height="90" rx="12" fill="none" stroke="#0e7c86" stroke-width="7"/>
      <circle cx="-70" cy="0" r="8" fill="#f6faf9" stroke="#0e7c86" stroke-width="5"/>
      <circle cx="70" cy="0" r="8" fill="#f6faf9" stroke="#0e7c86" stroke-width="5"/>
    </g>
    <g transform="translate(180,10) rotate(-4)">
      <rect x="-70" y="-45" width="140" height="90" rx="12" fill="none" stroke="#16233d" stroke-width="7"/>
      <circle cx="-70" cy="0" r="8" fill="#f6faf9" stroke="#16233d" stroke-width="5"/>
      <circle cx="70" cy="0" r="8" fill="#f6faf9" stroke="#16233d" stroke-width="5"/>
    </g>
    <path d="M-110 -5 L-70 -20" stroke="#b8862b" stroke-width="5" stroke-linecap="round"/>
    <path d="M70 -25 L110 -8" stroke="#b8862b" stroke-width="5" stroke-linecap="round"/>
  </g>
