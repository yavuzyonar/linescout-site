<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- two fanned playing cards, one jack one wild deuce -->
  <g transform="translate(600,225)">
    <g transform="rotate(-14)">
      <rect x="-60" y="-95" width="120" height="170" rx="12" fill="#fff" stroke="#16233d" stroke-width="6"/>
      <text x="-28" y="-40" font-family="Georgia, serif" font-size="46" fill="#16233d">J</text>
      <path d="M0 10 l16 24 l-16 24 l-16 -24 Z" fill="#16233d" opacity="0.7"/>
    </g>
    <g transform="rotate(12)">
      <rect x="-60" y="-95" width="120" height="170" rx="12" fill="#fff" stroke="#0e7c86" stroke-width="6"/>
      <text x="-22" y="-40" font-family="Georgia, serif" font-size="46" fill="#0e7c86">2</text>
      <path d="M0 10 l16 24 l-16 24 l-16 -24 Z" fill="#b8862b"/>
      <circle cx="0" cy="34" r="30" fill="none" stroke="#b8862b" stroke-width="4" opacity="0.6"/>
    </g>
  </g>
</svg>
