<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- smartphone with notification pings -->
  <g transform="translate(470,210)">
    <rect x="-70" y="-120" width="140" height="240" rx="22" fill="none" stroke="#16233d" stroke-width="9"/>
    <line x1="-30" y1="105" x2="30" y2="105" stroke="#16233d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-35" cy="-55" r="9" fill="#0e7c86"/>
    <line x1="-15" y1="-55" x2="40" y2="-55" stroke="#0e7c86" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <circle cx="-35" cy="-10" r="9" fill="#0e7c86"/>
    <line x1="-15" y1="-10" x2="48" y2="-10" stroke="#0e7c86" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <circle cx="-35" cy="35" r="9" fill="#0e7c86"/>
    <line x1="-15" y1="35" x2="34" y2="35" stroke="#0e7c86" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- gavel representing legal action -->
  <g transform="translate(760,230)">
    <g transform="rotate(-35)">
      <rect x="-80" y="-20" width="80" height="38" rx="7" fill="none" stroke="#16233d" stroke-width="8"/>
      <rect x="-16" y="-30" width="26" height="58" rx="5" fill="none" stroke="#0e7c86" stroke-width="8"/>
    </g>
    <rect x="-70" y="55" width="140" height="14" rx="4" fill="#16233d"/>
    <line x1="-45" y1="55" x2="-45" y2="30" stroke="#16233d" stroke-width="7"/>
    <line x1="45" y1="55" x2="45" y2="30" stroke="#0e7c86" stroke-width="7"/>
  </g>
</svg>
