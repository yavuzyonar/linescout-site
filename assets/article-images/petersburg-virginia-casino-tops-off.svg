    <line x1="-55" y1="-90" x2="55" y2="-90" stroke="#16233d" stroke-width="4" opacity="0.5"/>
    <line x1="-55" y1="-50" x2="55" y2="-50" stroke="#16233d" stroke-width="4" opacity="0.5"/>
    <line x1="-55" y1="-10" x2="55" y2="-10" stroke="#16233d" stroke-width="4" opacity="0.5"/>
    <line x1="0" y1="-170" x2="0" y2="-215" stroke="#0e7c86" stroke-width="6"/>
    <path d="M0 -215 L40 -200 L0 -188 Z" fill="#b8862b"/>
