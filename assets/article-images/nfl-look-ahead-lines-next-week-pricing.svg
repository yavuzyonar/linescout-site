<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- two schedule/calendar cards, the second one glowing ahead in time -->
  <g transform="translate(470,200)">
    <rect x="-140" y="-90" width="170" height="180" rx="14" fill="none" stroke="#16233d" stroke-width="8" opacity="0.55"/>
    <line x1="-140" y1="-45" x2="-30" y2="-45" stroke="#16233d" stroke-width="6" opacity="0.4"/>
    <line x1="-120" y1="-15" x2="-50" y2="-15" stroke="#16233d" stroke-width="6" opacity="0.3"/>
    <line x1="-120" y1="15" x2="-50" y2="15" stroke="#16233d" stroke-width="6" opacity="0.3"/>
  </g>
  <g transform="translate(680,200)">
    <rect x="-30" y="-100" width="190" height="200" rx="16" fill="#fff" stroke="#0e7c86" stroke-width="9"/>
    <line x1="0" y1="-55" x2="120" y2="-55" stroke="#0e7c86" stroke-width="7"/>
    <line x1="15" y1="-20" x2="100" y2="-20" stroke="#16233d" stroke-width="7" opacity="0.6"/>
    <line x1="15" y1="15" x2="100" y2="15" stroke="#16233d" stroke-width="7" opacity="0.6"/>
    <line x1="15" y1="50" x2="70" y2="50" stroke="#b8862b" stroke-width="7"/>
  </g>
  <!-- forward arrow between them -->
  <g transform="translate(600,200)" stroke="#b8862b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-25" y1="0" x2="25" y2="0"/>
    <path d="M8 -18 L25 0 L8 18"/>
  </g>
</svg>
