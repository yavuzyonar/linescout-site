    <circle cx="0" cy="0" r="105" fill="none" stroke="#16233d" stroke-width="8"/>
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#16233d" stroke-width="5" opacity="0.6"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#16233d" stroke-width="5" opacity="0.6"/>
    <path d="M-74 -74 A105 105 0 0 1 74 74" fill="none" stroke="#16233d" stroke-width="5" opacity="0.6"/>
    <path d="M-74 74 A105 105 0 0 1 74 -74" fill="none" stroke="#16233d" stroke-width="5" opacity="0.6"/>
  </g>
  <g transform="translate(740,210)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#0e7c86" stroke-width="8"/>
    <path d="M0 0 L0 -100 A100 100 0 0 1 70 70 Z" fill="#b8862b" opacity="0.28"/>
