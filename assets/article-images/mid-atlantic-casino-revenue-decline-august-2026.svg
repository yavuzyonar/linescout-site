<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- regional map outline with several declining bars and one rising online bar -->
  <g transform="translate(450,270)">
    <rect x="0" y="-70" width="30" height="70" rx="4" fill="#16233d" opacity="0.75"/>
    <rect x="40" y="-58" width="30" height="58" rx="4" fill="#16233d" opacity="0.65"/>
    <rect x="80" y="-46" width="30" height="46" rx="4" fill="#16233d" opacity="0.55"/>
    <rect x="120" y="-34" width="30" height="34" rx="4" fill="#16233d" opacity="0.45"/>
    <rect x="160" y="-92" width="30" height="92" rx="4" fill="#16233d" opacity="0.85"/>
  </g>
  <g transform="translate(730,200)">
    <polyline points="0,50 35,10 70,25 105,-35" fill="none" stroke="#0e7c86" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="105" cy="-35" r="10" fill="#b8862b"/>
    <text x="10" y="75" font-family="Arial" font-size="18" fill="#0e7c86">online</text>
  </g>
