<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- a card sliding flat across a felt table, with motion lines -->
  <g transform="translate(590,250)">
    <ellipse cx="0" cy="40" rx="230" ry="26" fill="none" stroke="#16233d" stroke-width="5" opacity="0.4"/>
    <g transform="translate(20,0) rotate(-6)">
      <rect x="-55" y="-78" width="110" height="156" rx="12" fill="none" stroke="#16233d" stroke-width="7"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#0e7c86" stroke-width="6"/>
      <text x="-32" y="-48" font-family="Arial" font-size="26" fill="#0e7c86">A</text>
    </g>
    <g stroke="#0e7c86" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <line x1="-190" y1="-10" x2="-130" y2="-10"/>
      <line x1="-190" y1="12" x2="-140" y2="12"/>
      <line x1="-190" y1="34" x2="-150" y2="34"/>
    </g>
  </g>
  <circle cx="790" cy="100" r="7" fill="#b8862b"/>
</svg>
