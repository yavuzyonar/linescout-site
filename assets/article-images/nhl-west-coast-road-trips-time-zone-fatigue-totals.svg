<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- clock face representing time-zone shift -->
  <g transform="translate(430,210)">
    <circle cx="0" cy="0" r="92" fill="none" stroke="#16233d" stroke-width="9"/>
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#16233d" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="48" y2="24" stroke="#16233d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#16233d"/>
  </g>
  <!-- dashed flight path across time zones -->
  <path d="M 540 150 Q 660 15 790 150" fill="none" stroke="#b8862b" stroke-width="5" stroke-dasharray="3 10" stroke-linecap="round"/>
  <!-- hockey stick and puck at destination -->
  <g transform="translate(830,210)">
    <ellipse cx="-20" cy="60" rx="55" ry="16" fill="#16233d"/>
    <path d="M65 -95 L5 90 L-35 90" fill="none" stroke="#0e7c86" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
