<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- meter filling to a hard cap line, with excess coins spilling above the cap -->
  <g transform="translate(540,280)">
    <rect x="-45" y="-160" width="90" height="160" rx="14" fill="none" stroke="#16233d" stroke-width="8"/>
    <rect x="-45" y="-95" width="90" height="95" rx="4" fill="#0e7c86" opacity="0.35"/>
    <line x1="-55" y1="-95" x2="55" y2="-95" stroke="#b8862b" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(670,95)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#b8862b" stroke-width="6"/>
    <text x="0" y="7" font-family="Arial" font-size="18" fill="#b8862b" text-anchor="middle">$</text>
  </g>
  <g transform="translate(715,135)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#0e7c86" stroke-width="5" opacity="0.6"/>
  </g>
  <g transform="translate(645,145)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#0e7c86" stroke-width="5" opacity="0.45"/>
  </g>
</svg>
