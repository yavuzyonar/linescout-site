    <rect x="-43" y="-95" width="86" height="140" rx="10" fill="none" stroke="#0e7c86" stroke-width="8"/>
    <rect x="64" y="-95" width="86" height="140" rx="10" fill="none" stroke="#16233d" stroke-width="8"/>
    <text x="-107" y="-8" font-family="Arial" font-size="48" fill="#16233d" text-anchor="middle" font-weight="bold">7</text>
    <text x="0" y="-8" font-family="Arial" font-size="48" fill="#0e7c86" text-anchor="middle" font-weight="bold">7</text>
    <text x="107" y="-8" font-family="Arial" font-size="48" fill="#16233d" text-anchor="middle" font-weight="bold">7</text>
  </g>
  <g transform="translate(745,150)" fill="none" stroke="#b8862b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
