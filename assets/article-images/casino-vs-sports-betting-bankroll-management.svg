    <ellipse cx="0" cy="-16" rx="46" ry="14" fill="#0e7c86"/>
    <ellipse cx="0" cy="-32" rx="46" ry="14" fill="#16233d"/>
    <ellipse cx="0" cy="-48" rx="46" ry="14" fill="#0e7c86"/>
    <ellipse cx="0" cy="-64" rx="46" ry="14" fill="#16233d"/>
