    <line x1="65" y1="-45" x2="175" y2="-45" stroke="#16233d" stroke-width="5" opacity="0.4"/>
    <line x1="65" y1="-25" x2="150" y2="-25" stroke="#16233d" stroke-width="5" opacity="0.4"/>
