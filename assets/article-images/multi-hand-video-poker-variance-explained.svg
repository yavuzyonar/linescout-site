    <rect x="-55" y="-85" width="110" height="155" rx="10" fill="#fff" stroke="#16233d" stroke-width="6"/>
    <text x="-30" y="-45" font-family="Georgia, serif" font-size="28" fill="#16233d">K</text>
  </g>
  <g transform="translate(630,130)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <rect x="100" y="0" width="80" height="60" rx="8" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <rect x="0" y="80" width="80" height="60" rx="8" fill="none" stroke="#b8862b" stroke-width="6"/>
    <rect x="100" y="80" width="80" height="60" rx="8" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <rect x="0" y="160" width="80" height="60" rx="8" fill="none" stroke="#0e7c86" stroke-width="6"/>
    <rect x="100" y="160" width="80" height="60" rx="8" fill="none" stroke="#0e7c86" stroke-width="6"/>
  </g>
  <path d="M540 205 Q 590 160 630 160" fill="none" stroke="#16233d" stroke-width="5" stroke-dasharray="3 9" stroke-linecap="round"/>
