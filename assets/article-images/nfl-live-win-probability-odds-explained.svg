<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- live win-probability chart with pulsing "LIVE" signal -->
  <g transform="translate(450,270)">
    <rect x="-40" y="-190" width="420" height="220" rx="14" fill="none" stroke="#16233d" stroke-width="6" opacity="0.35"/>
    <polyline points="-20,10 40,-30 100,10 160,-70 220,-40 280,-110 340,-60 380,-140"
      fill="none" stroke="#0e7c86" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="380" cy="-140" r="11" fill="#b8862b"/>
  </g>
  <g transform="translate(815,115)">
    <circle cx="0" cy="0" r="13" fill="#16233d"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#16233d" stroke-width="4" opacity="0.45"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#16233d" stroke-width="4" opacity="0.22"/>
  </g>
  <g transform="translate(720,350)">
    <ellipse cx="0" cy="0" rx="60" ry="32" fill="none" stroke="#16233d" stroke-width="7"/>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#16233d" stroke-width="4" opacity="0.6"/>
    <line x1="-14" y1="-9" x2="-14" y2="9" stroke="#16233d" stroke-width="4" opacity="0.6"/>
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#16233d" stroke-width="4" opacity="0.6"/>
    <line x1="14" y1="-9" x2="14" y2="9" stroke="#16233d" stroke-width="4" opacity="0.6"/>
  </g>
</svg>
