<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- number line with small hooks curling off at the key numbers 3 and 7 -->
  <g transform="translate(420,230)">
    <line x1="0" y1="0" x2="360" y2="0" stroke="#16233d" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#16233d" stroke-width="6"/>
    <line x1="360" y1="-14" x2="360" y2="14" stroke="#16233d" stroke-width="6"/>
    <line x1="140" y1="-20" x2="140" y2="20" stroke="#0e7c86" stroke-width="9"/>
    <path d="M140 -20 q34 -34 60 -2" fill="none" stroke="#0e7c86" stroke-width="8" stroke-linecap="round"/>
    <text x="140" y="55" font-family="Arial" font-size="26" fill="#0e7c86" text-anchor="middle">3</text>
    <line x1="250" y1="-20" x2="250" y2="20" stroke="#b8862b" stroke-width="9"/>
    <path d="M250 -20 q34 -34 60 -2" fill="none" stroke="#b8862b" stroke-width="8" stroke-linecap="round"/>
    <text x="250" y="55" font-family="Arial" font-size="26" fill="#b8862b" text-anchor="middle">7</text>
  </g>
