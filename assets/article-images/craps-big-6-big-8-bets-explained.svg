    <rect x="-130" y="-70" width="120" height="140" rx="10" fill="none" stroke="#16233d" stroke-width="7"/>
    <text x="-70" y="12" font-family="Arial" font-size="56" fill="#16233d" text-anchor="middle" font-weight="bold">6</text>
    <rect x="10" y="-70" width="120" height="140" rx="10" fill="none" stroke="#0e7c86" stroke-width="7"/>
    <text x="70" y="12" font-family="Arial" font-size="56" fill="#0e7c86" text-anchor="middle" font-weight="bold">8</text>
  </g>
  <g transform="translate(790,270) rotate(-10)">
    <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#fff" stroke="#16233d" stroke-width="6"/>
    <circle cx="-16" cy="-16" r="7" fill="#16233d"/>
    <circle cx="16" cy="16" r="7" fill="#16233d"/>
  </g>
  <g transform="translate(855,185) rotate(14)">
    <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#fff" stroke="#b8862b" stroke-width="6"/>
    <circle cx="-16" cy="-16" r="7" fill="#b8862b"/>
    <circle cx="16" cy="-16" r="7" fill="#b8862b"/>
    <circle cx="-16" cy="16" r="7" fill="#b8862b"/>
    <circle cx="16" cy="16" r="7" fill="#b8862b"/>
    <circle cx="0" cy="0" r="7" fill="#b8862b"/>
