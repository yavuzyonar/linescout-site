<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4f3"/>
      <stop offset="100%" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c86" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <polygon points="1200,0 1200,110 780,400 640,400" fill="url(#beam)"/>
  <g stroke="#0e7c86" stroke-opacity="0.10" fill="none" stroke-width="2">
    <circle cx="1160" cy="-30" r="140"/>
    <circle cx="1160" cy="-30" r="240"/>
    <circle cx="1160" cy="-30" r="340"/>
  </g>
  <circle cx="70" cy="60" r="7" fill="#b8862b"/>

  <!-- ladder of alternate-line rungs, one highlighted as the main line -->
  <g transform="translate(450,120)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="#16233d" stroke-width="2" opacity="0.35"/>
    <line x1="40" y1="40" x2="260" y2="40" stroke="#16233d" stroke-width="2" opacity="0.35"/>
    <line x1="10" y1="80" x2="290" y2="80" stroke="#0e7c86" stroke-width="9" stroke-linecap="round"/>
    <circle cx="150" cy="80" r="10" fill="#b8862b"/>
    <line x1="55" y1="120" x2="245" y2="120" stroke="#16233d" stroke-width="2" opacity="0.35"/>
    <line x1="20" y1="160" x2="280" y2="160" stroke="#16233d" stroke-width="2" opacity="0.35"/>
    <path d="M150 -30 L150 210" stroke="#16233d" stroke-width="4" stroke-dasharray="2 10" opacity="0.4"/>
  </g>
</svg>
